name: shiny-path-backend

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: shiny_path
      POSTGRES_USER: ${DB_USERNAME:-shiny_path}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-shiny_path} -d shiny_path"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shiny_path
      DB_USERNAME: ${DB_USERNAME:-shiny_path}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
